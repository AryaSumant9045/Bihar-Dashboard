name: District News Daily

# Har 24 ghante me ek baar: sabhi 38 Bihar districts ki latest news
# /api/cron/district-news pipeline se fetch hokar Supabase (district_news) me save hoti hai.
# Manual run bhi kar sakte ho: Actions tab → "District News Daily" → Run workflow.

on:
  schedule:
    - cron: '30 18 * * *' # 12:00 AM IST daily (UTC 18:30)
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call district news cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -sf --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/district-news"
          else
            curl -sf --max-time 300 "$APP_URL/api/cron/district-news"
          fi
