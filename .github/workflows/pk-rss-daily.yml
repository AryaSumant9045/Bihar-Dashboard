name: PK FetchRSS Ingestion (Daily)

# Roz subah 8:30 AM IST (UTC 03:00): FetchRSS PK feed fetch karke
# Supabase (pk_rss) table me save hota hai (heading UNIQUE → no duplicates).
# Manual run: Actions tab → "PK FetchRSS Ingestion (Daily)" → Run workflow.

on:
  schedule:
    - cron: '0 3 * * *'  # 8:30 AM IST daily (UTC 03:00)
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call pk-rss cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -sf --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/pk-rss"
          else
            curl -sf --max-time 120 "$APP_URL/api/cron/pk-rss"
          fi
