name: Leadership Tracker (Daily 6AM & 5PM IST)

# Roz subah 6 baje aur shaam 5 baje (IST): Bihar political news (state RSS +
# district_news) se AI ke through leaders (Ministers/MPs/MLAs/Office-bearers)
# ki activities nikaal kar Supabase (leader_activities + leaders, LPI ke saath)
# me save hoti hain. Ye "👥 Leadership Tracker" page ko live banata hai.
# Manual run: Actions tab → "Leadership Tracker (Daily 6AM & 5PM IST)" → Run workflow.

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST daily (UTC 00:30)
    - cron: '30 11 * * *' # 5:00 PM IST daily (UTC 11:30)
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call leadership pipeline cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -sf --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/leadership-pipeline"
          else
            curl -sf --max-time 300 "$APP_URL/api/cron/leadership-pipeline"
          fi
