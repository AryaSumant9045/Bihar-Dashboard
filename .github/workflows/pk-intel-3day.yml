name: PK Intel (Daily 6AM & 5PM IST)

# Roz subah 6 baje aur shaam 5 baje (IST): PK Tracker ki Activity Log,
# Strategy Cards, Movement Map aur Social Monitor — Jan Suraaj X posts +
# press releases + Bihar district news se AI (Gemini/Groq) analysis karke
# Supabase (pk_intel) me live snapshot save hota hai.
# Manual run: Actions tab → "PK Intel (Daily 6AM & 5PM IST)" → Run workflow.

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST daily (UTC 00:30)
    - cron: '30 11 * * *' # 5:00 PM IST daily (UTC 11:30)
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call PK intel cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="${CRON_SECRET:-bihar-cron-secret-2026}"
          curl -sf --max-time 300 "$APP_URL/api/cron/pk-intel?secret=$SECRET"
