name: Issues & Grievances (Daily 6AM & 5PM IST)

# Roz subah 6 baje aur shaam 5 baje (IST): district_news (Live Hindustan
# district feeds) ki taaza headlines se AI (Gemini/Groq) ke through
# real local/public issues nikaal kar Supabase (issues) table me save hota
# hai. Ye "📋 Issues & Grievances" page ko live banata hai.
# Manual run: Actions tab → "Issues & Grievances (Daily 6AM & 5PM IST)" → Run workflow.

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST daily (UTC 00:30)
    - cron: '30 11 * * *' # 5:00 PM IST daily (UTC 11:30)
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call issues pipeline cron endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SECRET="${CRON_SECRET:-bihar-cron-secret-2026}"
          curl -sf --max-time 300 "$APP_URL/api/cron/issues-pipeline?secret=$SECRET"
