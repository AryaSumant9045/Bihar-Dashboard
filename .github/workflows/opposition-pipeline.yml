name: Opposition Pipeline (YouTube + RSS + AI summary)

# Opposition page ka "YouTube videos + RSS feeds · Latest first" section isi pipeline se
# bharta hai. Pehle iska koi scheduler hi nahi tha aur upsert galat conflict target
# ('opposition_news_heading_party_key' as column) ki wajah se inserts fail ho rahe the.
# Ab ye har 2 ghante chalta hai.

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

jobs:
  opposition:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run opposition pipeline
        env:
          APP_URL: ${{ vars.APP_URL || 'https://bihar-dashboard-ojls.vercel.app' }}
        run: |
          url="$APP_URL/api/cron/opposition-pipeline?secret=*** secrets.CRON_SECRET }}"
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if curl -sf --max-time 120 "$url"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::warning::opposition pipeline failed after 3 attempts"
          exit 0
